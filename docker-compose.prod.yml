x-backend-env: &backend-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_SECURE_SSL: "true"
  DJANGO_SESSION_COOKIE_SECURE: "true"
  DJANGO_CSRF_COOKIE_SECURE: "true"
  DJANGO_HSTS_SECONDS: "31536000"
  DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-industrial_prospecting}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  USE_S3: ${USE_S3:-false}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
  CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-cerebras/Llama-3.3-70B}
  APIFY_API_KEY: ${APIFY_API_KEY}
  APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass~crawler-google-places}
  SNOV_CLIENT_ID: ${SNOV_CLIENT_ID}
  SNOV_CLIENT_SECRET: ${SNOV_CLIENT_SECRET}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: "true"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  BASE_URL: ${BASE_URL}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  # Perfil "local": inicia solo con `--profile local`.
  # En AWS apunta a RDS vía DB_HOST / DB_PASSWORD.
  db:
    profiles: [ "local" ]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_prospecting}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-industrial_prospecting}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ── Redis ────────────────────────────────────────────────────
  # Perfil "local": inicia solo con `--profile local`.
  # En AWS apunta a ElastiCache vía REDIS_URL / REDIS_PASSWORD.
  redis:
    profiles: [ "local" ]
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Backend (Gunicorn) ──────────────────────────────────────
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    ports:
      - '8000:8000'
    networks:
      - frontend_net
      - backend_net
      - db_net
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")' || exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      <<: *backend-env
    networks:
      - backend_net
      - db_net
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 0" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  # ── Celery Beat ─────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    networks:
      - backend_net
      - db_net
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"from celery import Celery; c=Celery(broker='${REDIS_URL}'); c.connection().ensure_connection(max_retries=1)\" || exit 0" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    image: ${ECR_REPO:-alcret}/frontend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_PROXY_URL: http://web:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.industrialprospecting.com/api}
    ports:
      - '3000:3000'
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/\", (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })' || exit 0" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

volumes:
  pgdata:
