x-backend-env: &backend-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_SECURE_SSL: "true"
  DJANGO_SESSION_COOKIE_SECURE: "true"
  DJANGO_CSRF_COOKIE_SECURE: "true"
  DJANGO_HSTS_SECONDS: "31536000"
  DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-industrial_prospecting}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: db
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  USE_S3: ${USE_S3:-false}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
  CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-cerebras/Llama-3.3-70B}
  APIFY_API_KEY: ${APIFY_API_KEY}
  APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass~crawler-google-places}
  SNOV_CLIENT_ID: ${SNOV_CLIENT_ID}
  SNOV_CLIENT_SECRET: ${SNOV_CLIENT_SECRET}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: "true"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  BASE_URL: ${BASE_URL}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}

networks:
  backend_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_prospecting}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-industrial_prospecting}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REPO:-alcret}/backend:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  pgdata:
