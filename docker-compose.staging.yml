networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_prospecting_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-industrial_prospecting_staging}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASS}
        --maxmemory 384mb
        --maxmemory-policy allkeys-lru
        --save ""
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASS}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh entrypoint.sh
    volumes:
      - static_volume_staging:/app/staticfiles
      - media_volume_staging:/app/media
    env_file:
      - .env.staging
    ports:
      - '0.0.0.0:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - media_volume_staging:/app/media
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - frontend_net
      - backend_net
      - db_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://staging.api.industrialprospecting.com/api}
    env_file:
      - .env.staging
    ports:
      - '0.0.0.0:3000:3000'
    depends_on:
      - backend
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

volumes:
  pgdata_staging:
  static_volume_staging:
  media_volume_staging:
